  <style>
    .menu-header nav{flex-wrap:wrap;justify-content:flex-end}
    .menu-shell{max-width:920px;padding-block:50px 70px}
    .menu-shell>.eyebrow{color:var(--green)}
    .menu-jumps{display:flex;flex-wrap:wrap;gap:12px 24px;padding:20px 0;border-block:1px solid var(--line);margin-bottom:40px;font-size:14px}
    .menu-content h1{font-size:clamp(38px,6vw,60px);margin-bottom:20px}
    .menu-content h1+p{background:var(--paper);border-left:4px solid var(--green);padding:16px 20px;margin-bottom:40px}
    .menu-content h2{font-size:38px;margin:60px 0 28px;padding-top:25px;border-top:2px solid var(--green)}
    .menu-content h3{font-size:29px;margin:38px 0 15px;color:var(--green)}
    .menu-content h4{font:400 22px Georgia,serif;margin:28px 0 14px}
    .menu-content p{max-width:75ch;color:var(--muted)}
    .menu-table{overflow-x:auto;margin:16px 0 26px}
    .menu-table table{font-size:14px;line-height:1.6}
    .menu-table th,.menu-table td{white-space:normal;text-align:left;vertical-align:top;padding:14px 12px}
    .menu-table thead{background:var(--paper)}
    .menu-table thead th{font-weight:bold;font-size:12px;letter-spacing:.03em}
    .menu-table tbody th{font-weight:600;min-width:145px}
    .menu-table td:last-child,.menu-table thead th:last-child{text-align:right;width:140px;min-width:105px}
    .menu-table td:last-child{font-variant-numeric:tabular-nums}
    .menu-content ul{padding-left:22px;color:var(--muted)}
    .menu-footer{border-top:1px solid var(--line)}
    @media(max-width:700px){.menu-shell{padding-block:35px 50px}.menu-header nav{font-size:12px}.menu-table th,.menu-table td{padding:12px 8px}.menu-table tbody th{min-width:110px}.menu-table td:last-child,.menu-table thead th:last-child{min-width:85px;width:100px}.menu-table table{font-size:13px}.menu-content h2{font-size:32px}}
    @media print{.site-header,.menu-jumps,.menu-footer,.skip-link{display:none}.menu-shell{width:100%;max-width:none;padding:0}.menu-content h1{font-size:28px}.menu-content h2{font-size:24px;margin-top:28px}.menu-content h3{font-size:20px;break-after:avoid}.menu-table{overflow:visible}.menu-table tr{break-inside:avoid}body{background:white;color:black}.menu-content p{color:black}}
